<!-- @dsCard group="Feedback" height=300 subtitle="OK, degraded, failing and unknown: a dot, then the words" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatusMark — preview</title>
<style>
  body { margin: 0; padding: var(--space-6) var(--space-4); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-variant-numeric: tabular-nums; }
  p, h1, h2, h3, ul, ol, dl, dd { margin: 0; }
  .stack { display: flex; flex-direction: column; gap: var(--space-6); max-width: 720px; }
  .state { color: var(--ink-secondary); margin-bottom: var(--space-2); }
  .muted { color: var(--ink-secondary); }
  .mono { font-family: var(--font-mono); }
  a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .mark { display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 600; }
  .mark i { width: 10px; height: 10px; border-radius: var(--radius-full); flex: none; }
  .mark .ok { background: var(--pen); } .mark .degraded { background: var(--pen-partial); }
  .mark .failing { background: var(--pen-missed); } .mark .unknown { box-shadow: inset 0 0 0 2px var(--control-border); }
  .caution { display: flex; gap: var(--space-2); align-items: flex-start; color: var(--caution-ink); }
  .error { display: flex; gap: var(--space-2); align-items: flex-start; color: var(--error-ink); }
  .caution svg, .error svg { flex: none; width: 16px; height: 16px; margin-top: 3px; }
  .facts { display: grid; grid-template-columns: 1fr; gap: var(--space-3); }
  .facts > div { display: grid; gap: 2px; }
  .facts dt { color: var(--ink-secondary); }
  @media (min-width: 640px) { .facts { grid-template-columns: minmax(9rem, max-content) 1fr; gap: var(--space-2) var(--space-6); } .facts > div { display: contents; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay); padding: var(--space-6); display: grid; gap: var(--space-4); }
  @media (max-width: 639px) { .panel { padding: var(--space-4); } }
</style>
</head>
<body>
<div class="stack">
  <div><p class="caption state">The four states, in body</p>
    <p class="body" style="display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-6)"><span class="mark"><i class="ok" aria-hidden="true"></i>OK</span><span class="mark"><i class="degraded" aria-hidden="true"></i>Degraded</span><span class="mark"><i class="failing" aria-hidden="true"></i>Failing</span><span class="mark"><i class="unknown" aria-hidden="true"></i>Unknown</span></p></div>
  <div><p class="caption state">With its own words, beside a sentence</p>
    <p class="body"><span class="mark"><i class="ok" aria-hidden="true"></i>OK</span><span class="muted"> · </span>Claude is answering NanoClaw’s agents.</p></div>
  <div><p class="caption state">In a fact, regular weight</p>
    <p class="caption">cli <span class="mark" style="font-weight:400"><i class="ok" aria-hidden="true"></i>Connected</span> &nbsp; slack <span class="mark" style="font-weight:400"><i class="failing" aria-hidden="true"></i>Not connected</span></p></div>
  <div><p class="caption state">As a severity (WarningList)</p>
    <p class="body" style="display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-6)"><span class="mark"><i class="failing" aria-hidden="true"></i>Error</span><span class="mark"><i class="degraded" aria-hidden="true"></i>Warning</span><span class="mark"><i class="unknown" aria-hidden="true"></i>Note</span></p></div>
</div>
<script></script>
</body>
</html>
