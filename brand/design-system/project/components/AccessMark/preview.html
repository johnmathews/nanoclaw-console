<!-- @dsCard group="Status" height=300 subtitle="Whether something can be written: read-write as a caution in words, read-only plainly" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AccessMark — preview</title>
<style>
  body { margin: 0; padding: var(--space-6) var(--space-4); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-variant-numeric: tabular-nums; }
  p, h1, h2, h3, ul, ol, dl, dd { margin: 0; }
  .stack { display: flex; flex-direction: column; gap: var(--space-6); max-width: 720px; }
  .state { color: var(--ink-secondary); margin-bottom: var(--space-2); }
  .muted { color: var(--ink-secondary); }
  .mono { font-family: var(--font-mono); }
  a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .mark { display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 600; }
  .mark i { width: 10px; height: 10px; border-radius: var(--radius-full); flex: none; }
  .mark .ok { background: var(--pen); } .mark .degraded { background: var(--pen-partial); }
  .mark .failing { background: var(--pen-missed); } .mark .unknown { box-shadow: inset 0 0 0 2px var(--control-border); }
  .caution { display: flex; gap: var(--space-2); align-items: flex-start; color: var(--caution-ink); }
  .error { display: flex; gap: var(--space-2); align-items: flex-start; color: var(--error-ink); }
  .caution svg, .error svg { flex: none; width: 16px; height: 16px; margin-top: 3px; }
  .facts { display: grid; grid-template-columns: 1fr; gap: var(--space-3); }
  .facts > div { display: grid; gap: 2px; }
  .facts dt { color: var(--ink-secondary); }
  @media (min-width: 640px) { .facts { grid-template-columns: minmax(9rem, max-content) 1fr; gap: var(--space-2) var(--space-6); } .facts > div { display: contents; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay); padding: var(--space-6); display: grid; gap: var(--space-4); }
  @media (max-width: 639px) { .panel { padding: var(--space-4); } }
  ul.items { list-style: none; padding: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  ul.items li { display: grid; gap: var(--space-1); padding: var(--space-3) 0; border-top: 1px solid var(--line); }
  ul.items li:first-child { border-top: 0; }
  @media (min-width: 640px) { ul.items li { grid-template-columns: 7rem 1fr; column-gap: var(--space-4); } }
  .when { display: flex; flex-wrap: wrap; gap: 0 var(--space-4); color: var(--ink-secondary); margin-top: var(--space-1); }
  ul.rows { list-style: none; padding: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  ul.rows > li { display: grid; gap: var(--space-2); padding: var(--space-4) 0; border-top: 1px solid var(--line); }
  ul.rows > li:first-child { border-top: 0; }
  .t { font-weight: 600; overflow-wrap: anywhere; }
  .wrap { overflow-wrap: anywhere; }
  pre.sample { margin: var(--space-1) 0 0; font-family: var(--font-mono); white-space: pre-wrap; word-break: break-all; color: var(--ink-secondary); }
  .grid2 { display: grid; gap: var(--space-6); }
  @media (min-width: 1024px) { .grid2 { grid-template-columns: 1fr 1fr; align-items: start; } }
  .access-ro { color: var(--ink-secondary); }
  .seen { display: flex; flex-wrap: wrap; gap: 0 var(--space-4); color: var(--ink-secondary); }
  @media (min-width: 640px) { ul.rows.marked > li { grid-template-columns: 7rem 1fr; column-gap: var(--space-4); } }
</style>
</head>
<body>
<div class="stack">
  <div><p class="caption state">A mount that can be written</p>
  <p class="caption caution" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><span>Read-write: the agent can change these files</span></p></div>
  <div><p class="caption state">A read-only mount</p>
  <p class="caption access-ro">Read-only</p></div>
  <div><p class="caption state">In a group card’s facts</p>
  <dl class="facts caption"><div><dt>Mounts</dt><dd><span class="caution" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><span>2 mounts, 1 read-write</span></span></dd></div><div><dt>Mounts</dt><dd>1 mount, read-only</dd></div></dl></div>
</div>
<script></script>
</body>
</html>
