[project]
name = "nanoclaw-console-broker"
version = "0.1.0"
description = "The only holder of NanoClaw's control socket: a fixed verb list, redaction and a cache"
requires-python = ">=3.13,<3.14"
# Standard library only at runtime: this process holds full NanoClaw authority, so every dependency
# is attack surface (docs/architecture.md §2).
dependencies = []

[project.scripts]
nanoclaw-broker = "nanoclaw_broker.__main__:main"

[dependency-groups]
dev = [
    "coverage>=7.17",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.2,<1.4",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nanoclaw_broker"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["nanoclaw_broker"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["nanoclaw_broker", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ANN"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ANN401"]
