[project]
name = "nanoclaw-console-api"
version = "0.1.0"
description = "The NanoClaw console's API: reads NanoClaw through the broker and serves the web app"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cronsim>=2.8",
    "fastapi>=0.162",
    "httpx2>=2.16",
    "pyjwt[crypto]>=2.15",
    "tzdata>=2026.5",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "coverage>=7.17",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nanoclaw_console"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["nanoclaw_console"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["nanoclaw_console", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ANN"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ANN401"]
